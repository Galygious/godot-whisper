name: Quest Android ARM64
on:
  workflow_dispatch:
  push:
    branches: [quest-android]
  pull_request:
    branches: [quest-android]
permissions:
  contents: read
concurrency:
  group: quest-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install pinned build tools
        run: |
          python -m pip install scons==4.11.1
          sdkmanager 'ndk;27.3.13750724'
      - name: Build and check
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.3.13750724"
          scons platform=android arch=arm64 target=template_release ANDROID_HOME= build_profile=scripts/android_build_profile.json -j2
          python scripts/check_android_arm64.py --ndk "$ANDROID_NDK_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-Whisper-Android-ARM64
          path: bin/addons/godot_whisper/bin/libgodot_whisper.android.template_release.arm64.so
          if-no-files-found: error
